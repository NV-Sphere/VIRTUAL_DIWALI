<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Happy Diwali – Touchless Crackers</title>
<style>
html,body{margin:0;height:100%;background:#0a0410;color:#ffd27a;font-family:system-ui,sans-serif;display:flex;align-items:center;justify-content:center}
#wrap{position:relative;width:min(96vw,960px);aspect-ratio:16/9;border:4px solid #ff9f1c;border-radius:14px;overflow:hidden;box-shadow:0 0 50px #ff9f1c88;background:#000}
video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1);opacity:.5}
canvas{position:absolute;inset:0;width:100%;height:100%}
#start{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#0a0410f2;text-align:center;padding:20px}
button{font-size:1.1rem;padding:12px 28px;border:0;border-radius:30px;background:#ff9f1c;color:#2b1200;font-weight:700;cursor:pointer}
button:disabled{opacity:.5}
h1{margin:0;font-size:clamp(1.4rem,4vw,2.4rem)}
p{margin:0;max-width:540px;opacity:.9}
</style></head><body>
<div id="wrap">
<video id="v" playsinline muted></video>
<canvas id="c" width="960" height="540"></canvas>
<div id="start"><h1>🪔 Happy Diwali 🪔</h1>
<p>Allow the camera, then point your index finger at a cracker in a corner and hold it there for half a second, or pinch your thumb and finger together to fire instantly. No touching needed.</p>
<button id="go">Start</button><p id="msg"></p></div>
</div>
<script type="module">
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),W=960,H=540,vid=document.getElementById('v');
const msg=document.getElementById('msg'),goBtn=document.getElementById('go');
const MP="https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";
const MODEL="https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task";
const opts=[{n:'Phuljhadi',e:'🎇',d:8.5,p:[0,0]},{n:'Bomb',e:'💣',d:1.5,p:[1,0]},{n:'Rocket',e:'🚀',d:1.5,p:[0,1]},{n:'Anar',e:'⛲',d:4,p:[1,1]}];
opts.forEach(o=>{o.w=W*.2;o.h=H*.3;o.x=o.p[0]?W-o.w:0;o.y=o.p[1]?H-o.h:0;o.next=0;o.dwell=0;o.glow=0});
const DWELL=.55;
let parts=[],emit=[],rockets=[],rings=[],flash=0,shake=0,actx=null,noise=null;
let landmarker=null,lastT=-1,hasCam=false;
const cur={x:W/2,y:H/2,seen:0,active:false};
const MAXP=1300,trail=[];

function initAudio(){actx=new (window.AudioContext||window.webkitAudioContext)();
 const n=actx.sampleRate*1.5;noise=actx.createBuffer(1,n,actx.sampleRate);
 const d=noise.getChannelData(0);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n)*(1-i/n)}
function snd(dur,freq,vol,type){if(!actx||!noise)return;
 const s=actx.createBufferSource();s.buffer=noise;const f=actx.createBiquadFilter();
 f.type=type==='boom'?'lowpass':'highpass';f.frequency.value=freq;
 const g=actx.createGain();g.gain.setValueAtTime(vol,actx.currentTime);g.gain.linearRampToValueAtTime(0,actx.currentTime+dur);
 s.connect(f);f.connect(g);g.connect(actx.destination);s.start();s.stop(actx.currentTime+dur)}

function add(x,y,vx,vy,life,col,size,g,f){if(parts.length<MAXP)parts.push({x,y,vx,vy,l:life,m:life,c:col,s:size,g:g||0,f:f||0})}
function burst(x,y,n,sp,cols,ring){
 for(let i=0;i<n;i++){const a=ring?(i/n)*6.283:Math.random()*6.283,v=ring?sp:Math.random()*sp;
  add(x,y,Math.cos(a)*v,Math.sin(a)*v,50+Math.random()*35,cols[i%cols.length],3,.05)}}

function trigger(o){
 const t=performance.now();if(t<o.next)return;o.next=t+o.d*1000;o.glow=1;
 const cx=o.x+o.w/2,cy=o.y+o.h/2;
 if(o.n==='Phuljhadi'){emit.push({t:'spark',x:cx,y:cy,start:t,end:t+8000});snd(1,3500,.12,'hiss')}
 else if(o.n==='Anar'){emit.push({t:'anar',x:cx,y:o.y+o.h*.75,end:t+4000});snd(.8,600,.15,'hiss')}
 else if(o.n==='Rocket'){rockets.push({x:cx,y:o.y,vy:-9,top:H*.12+Math.random()*H*.2});snd(.6,2500,.12,'hiss')}
 else{snd(1.3,300,.95,'boom');flash=.9;shake=24;rings.push({x:cx,y:cy,r:10,a:1});
  for(let i=0;i<220;i++){const a=Math.random()*6.283,v=Math.random()*12;
   add(cx,cy,Math.cos(a)*v,Math.sin(a)*v,35+Math.random()*35,['#fff','#ffb703','#fb5607','#ff006e'][i&3],3+Math.random()*3,.1)}}
}

class OneEuro{constructor(mc=1.4,b=.012,dc=1){this.mc=mc;this.b=b;this.dc=dc;this.x=null;this.dx=0}
 a(c,dt){const tau=1/(6.283*c);return 1/(1+tau/dt)}
 f(v,dt){if(this.x===null){this.x=v;return v}
  const d=(v-this.x)/dt;this.dx+=this.a(this.dc,dt)*(d-this.dx);
  const c=this.mc+this.b*Math.abs(this.dx);this.x+=this.a(c,dt)*(v-this.x);return this.x}
 reset(){this.x=null;this.dx=0}}
const fx=new OneEuro(),fy=new OneEuro();let lastTs=0,pts=null,pinchPrev=false;
function toScreen(p){const vw=vid.videoWidth,vh=vid.videoHeight;
 const sw=Math.min(vw,vh*16/9),sh=Math.min(vh,vw*9/16),sx=(vw-sw)/2,sy=(vh-sh)/2;
 return [(1-(p.x*vw-sx)/sw)*W,((p.y*vh-sy)/sh)*H]}
function track(){
 if(!landmarker||vid.readyState<2||vid.currentTime===lastT)return;
 lastT=vid.currentTime;const nowMs=performance.now();
 const r=landmarker.detectForVideo(vid,nowMs);
 if(r.landmarks&&r.landmarks.length){
  const L=r.landmarks[0];pts=L.map(toScreen);
  const dt=Math.max((nowMs-lastTs)/1000,.008);lastTs=nowMs;
  if(!cur.active){fx.reset();fy.reset()}
  cur.x=fx.f(pts[8][0],dt);cur.y=fy.f(pts[8][1],dt);
  cur.active=true;cur.seen=nowMs;
  const hs=Math.hypot(pts[0][0]-pts[9][0],pts[0][1]-pts[9][1])||1;
  const pinch=Math.hypot(pts[4][0]-pts[8][0],pts[4][1]-pts[8][1])/hs<.28;
  if(pinch&&!pinchPrev){for(const o of opts)if(boxHit(o,cur.x,cur.y,0))trigger(o)}
  pinchPrev=pinch;cur.pinch=pinch;
 }else if(nowMs-cur.seen>500){cur.active=false;pts=null;pinchPrev=false}
}
function boxHit(o,x,y,m){return x>=o.x-m&&x<o.x+o.w+m&&y>=o.y-m&&y<o.y+o.h+m}

let last=performance.now();
function step(now){
 const dt=Math.min((now-last)/1000,.05);last=now;
 track();
 if(cur.active&&!landmarker&&performance.now()-cur.seen>1500)cur.active=false;
 ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,W,H);
 // night tint
 const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'rgba(10,4,30,.55)');g.addColorStop(1,'rgba(40,10,10,.4)');
 ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 if(shake>.5){ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);shake*=.88}
 // title + diyas
 ctx.textAlign='center';ctx.shadowColor='#ff9f1c';ctx.shadowBlur=18;
 ctx.fillStyle='#ffd27a';ctx.font='bold 30px system-ui';ctx.fillText('✨ Happy Diwali ✨',W/2,48);
 ctx.shadowBlur=0;ctx.font='30px serif';
 for(let i=0;i<5;i++){const x=W/2+(i-2)*70,fl=.6+.4*Math.sin(now/180+i*1.7);
  ctx.globalAlpha=.25+.25*fl;ctx.fillStyle='#ffb703';ctx.beginPath();ctx.arc(x,H-30,22,0,6.283);ctx.fill();
  ctx.globalAlpha=1;ctx.fillText('🪔',x,H-18)}
 // dwell
 for(const o of opts){
  const inside=cur.active&&boxHit(o,cur.x,cur.y,o.dwell>0?28:0);
  o.dwell=inside?o.dwell+dt/DWELL:Math.max(0,o.dwell-dt*1.5);
  if(o.dwell>=1){trigger(o);o.dwell=0}
 }
 // emitters
 const t=performance.now();
 for(let i=emit.length-1;i>=0;i--){const e=emit[i];if(t>e.end){emit.splice(i,1);continue}
  if(e.t==='spark'){const px=cur.active?cur.x:e.x,py=cur.active?cur.y:e.y;
   if(e.first===undefined){e.x=px;e.y=py;e.first=1}
   const hvx=Math.max(-40,Math.min(40,px-e.x)),hvy=Math.max(-40,Math.min(40,py-e.y));e.x=px;e.y=py;
   e.burn=(t-e.start)/(e.end-e.start);const I=Math.max(0,1-Math.pow(e.burn,4));e.I=I;
   const n=Math.round(3+9*I);
   for(let k=0;k<n;k++){const a=Math.random()*6.283,v=1.5+Math.random()*6;
    add(px,py,Math.cos(a)*v+hvx*.25,Math.sin(a)*v-1+hvy*.25,16+Math.random()*16,['#fff','#ffe29a','#ffc857'][k%3],2+Math.random()*1.5,.16,Math.random()<.35)}
   if(e.burn>.85)add(px+10,py-4,Math.random()-.5,-1.2,40,'#555',5,-.01);
   if(Math.random()<.3*I)snd(.04,4500,.05,'hiss');
   trail.push({x:px,y:py,l:24})}
  else{for(let k=0;k<7;k++)add(e.x+(Math.random()-.5)*10,e.y,(Math.random()-.5)*5,-10-Math.random()*8,55+Math.random()*25,['#ffd166','#ff9f1c','#ef476f','#06d6a0','#fff'][k%5],3,.22)}}
 // rockets
 ctx.font='30px serif';
 for(let i=rockets.length-1;i>=0;i--){const r=rockets[i];r.y+=r.vy;
  for(let k=0;k<2;k++)add(r.x+(Math.random()-.5)*5,r.y+12,(Math.random()-.5),1+Math.random()*2,18,k?'#ffb703':'#ff6d00',3,0);
  if(r.y<=r.top){snd(1.2,400,.7,'boom');
   burst(r.x,r.y,90,7,['#ff006e','#ffbe0b','#3a86ff','#8338ec','#06d6a0'],false);
   burst(r.x,r.y,40,4.5,['#fff','#ffd166'],true);
   flash=Math.max(flash,.3);rockets.splice(i,1);continue}
  ctx.fillText('🚀',r.x,r.y+10)}
 // particles
 ctx.globalCompositeOperation='lighter';
 for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.x+=p.vx;p.y+=p.vy;p.vy+=p.g;p.vx*=.985;
  if(--p.l<=0){parts[i]=parts[parts.length-1];parts.pop();continue}
  if(p.f&&p.l<p.m*.5){p.f=0;for(let k=0;k<3;k++){const a=Math.random()*6.283,v=1+Math.random()*2.5;add(p.x,p.y,p.vx*.3+Math.cos(a)*v,p.vy*.3+Math.sin(a)*v,10+Math.random()*8,'#fff',2,.1)}}
  ctx.globalAlpha=p.l/p.m;ctx.fillStyle=p.c;ctx.fillRect(p.x,p.y,p.s,p.s)}
 // shockwave rings
 for(let i=rings.length-1;i>=0;i--){const r=rings[i];r.r+=22;r.a-=.04;if(r.a<=0){rings.splice(i,1);continue}
  ctx.globalAlpha=r.a;ctx.strokeStyle='#ffd27a';ctx.lineWidth=6;ctx.beginPath();ctx.arc(r.x,r.y,r.r,0,6.283);ctx.stroke()}
 ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
 // sparkler trail, tip glow, wire
 ctx.globalCompositeOperation='lighter';ctx.lineCap='round';
 for(let i=trail.length-1;i>=0;i--){trail[i].l--;if(trail[i].l<=0)trail.splice(i,1)}
 for(let i=1;i<trail.length;i++){const a=trail[i-1],b=trail[i];if(Math.hypot(a.x-b.x,a.y-b.y)>120)continue;
  ctx.globalAlpha=b.l/24*.8;ctx.strokeStyle='#ffd27a';ctx.lineWidth=2+4*b.l/24;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke()}
 for(const e of emit){if(e.t!=='spark'||e.I===undefined)continue;
  const R=(26+18*e.I)*(.8+.2*Math.random());
  const gr=ctx.createRadialGradient(e.x,e.y,0,e.x,e.y,R);
  gr.addColorStop(0,`rgba(255,250,230,${.95*e.I})`);gr.addColorStop(.4,`rgba(255,190,80,${.4*e.I})`);gr.addColorStop(1,'rgba(255,150,40,0)');
  ctx.globalAlpha=1;ctx.fillStyle=gr;ctx.fillRect(e.x-R,e.y-R,R*2,R*2)}
 ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;
 for(const e of emit){if(e.t!=='spark'||e.I===undefined)continue;
  const L=130,ch=20+80*e.burn;
  ctx.strokeStyle='#9aa0a6';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(e.x+3,e.y+6);ctx.lineTo(e.x+28,e.y+L);ctx.stroke();
  ctx.strokeStyle='#2a2a2a';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(e.x+3,e.y+6);ctx.lineTo(e.x+3+25*ch/L,e.y+6+ch);ctx.stroke()}
 // boxes
 for(const o of opts){o.glow*=.93;
  ctx.fillStyle=`rgba(255,159,28,${.14+o.glow*.4+o.dwell*.25})`;ctx.fillRect(o.x+4,o.y+4,o.w-8,o.h-8);
  ctx.strokeStyle='#ff9f1c';ctx.lineWidth=3;ctx.strokeRect(o.x+4,o.y+4,o.w-8,o.h-8);
  ctx.fillStyle='#fff';ctx.font='50px serif';ctx.fillText(o.e,o.x+o.w/2,o.y+o.h*.52);
  ctx.font='bold 18px system-ui';ctx.fillStyle='#ffd27a';ctx.fillText(o.n,o.x+o.w/2,o.y+o.h*.85);
  if(o.dwell>0){ctx.strokeStyle='#fff';ctx.lineWidth=5;ctx.beginPath();
   ctx.arc(o.x+o.w/2,o.y+o.h*.42,38,-1.5708,-1.5708+o.dwell*6.283);ctx.stroke()}}
 // hand skeleton + status
 if(pts){ctx.fillStyle='rgba(255,210,122,.8)';for(const p of pts){ctx.beginPath();ctx.arc(p[0],p[1],3,0,6.283);ctx.fill()}}
 ctx.font='16px system-ui';ctx.textAlign='center';ctx.fillStyle=cur.active?'#9dff9d':'#ffb3b3';
 if(landmarker)ctx.fillText(cur.active?(cur.pinch?'🤏 Pinch = fire now':'🖐 Hand detected'):'Show your hand to the camera',W/2,76);
 // fingertip cursor
 if(cur.active){ctx.shadowColor='#fff';ctx.shadowBlur=20;ctx.fillStyle='rgba(255,255,255,.9)';
  ctx.beginPath();ctx.arc(cur.x,cur.y,10,0,6.283);ctx.fill();
  ctx.shadowBlur=0;ctx.strokeStyle='#ff9f1c';ctx.lineWidth=3;ctx.beginPath();ctx.arc(cur.x,cur.y,18,0,6.283);ctx.stroke()}
 ctx.setTransform(1,0,0,1,0,0);
 if(flash>.02){ctx.fillStyle=`rgba(255,240,200,${flash})`;ctx.fillRect(0,0,W,H);flash*=.86}
 requestAnimationFrame(step);
}

// mouse / touch fallback acts as a "finger"
cv.addEventListener('pointermove',e=>{if(landmarker)return;const r=cv.getBoundingClientRect();
 cur.x=(e.clientX-r.left)/r.width*W;cur.y=(e.clientY-r.top)/r.height*H;cur.active=true;cur.seen=performance.now()});
addEventListener('keydown',e=>{const o=opts[+e.key-1];if(o)trigger(o)});

goBtn.onclick=async()=>{
 goBtn.disabled=true;initAudio();
 try{msg.textContent='Starting camera…';
  const s=await navigator.mediaDevices.getUserMedia({video:{width:{ideal:640},height:{ideal:360},frameRate:{ideal:30},facingMode:'user'}});
  vid.srcObject=s;await vid.play();hasCam=true;
 }catch(err){msg.textContent='Camera error: '+err.name+'. Mouse mode is on (move the mouse over a box).';await new Promise(r=>setTimeout(r,2500))}
 if(hasCam){
  try{msg.textContent='Loading hand tracker (needs internet)…';
   const {HandLandmarker,FilesetResolver}=await import(MP+'/+esm');
   const fs=await FilesetResolver.forVisionTasks(MP+'/wasm');
   const mk=d=>HandLandmarker.createFromOptions(fs,{baseOptions:{modelAssetPath:MODEL,delegate:d},runningMode:'VIDEO',numHands:1,minHandDetectionConfidence:.4,minHandPresenceConfidence:.4,minTrackingConfidence:.4});
   try{landmarker=await mk('GPU')}catch(e){landmarker=await mk('CPU')}
  }catch(err){msg.textContent='Hand tracker failed to load: '+(err.message||err)+'. Mouse mode is on.';await new Promise(r=>setTimeout(r,3000))}
 }
 document.getElementById('start').style.display='none';
};
requestAnimationFrame(step);
</script></body></html>
